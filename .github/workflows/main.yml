name: Ejecutar Bot de Telegram

on:
  schedule:
    # Se ejecuta automáticamente cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot pandas requests yfinance

    - name: Ejecutar Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bot.py
